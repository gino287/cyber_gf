<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cyber_gf 對話測試</title>
<style>
  :root { --bg:#111418; --panel:#1b2027; --line:#2c333d; --fg:#e6e9ee; --muted:#9aa3ae; --accent:#4f9dff; --ok:#3fb950; --warn:#d29922; --err:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, "Microsoft JhengHei", sans-serif; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  main { display:grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap:16px; padding:16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  h2 { font-size:15px; margin:0 0 10px; }
  video { width:100%; max-height:70vh; background:#000; border-radius:6px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:7px 14px; font-size:14px; cursor:pointer; }
  button.secondary { background:#39414d; }
  button:disabled { opacity:.45; cursor:default; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  .muted { color:var(--muted); }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; background:#39414d; font-weight:600; }
  .badge.asr, .badge.thinking, .badge.synthesizing { background:var(--warn); color:#111; }
  .badge.speaking { background:var(--accent); } .badge.done { background:var(--ok); color:#111; } .badge.error { background:var(--err); }
  .text { background:#0d1014; border:1px solid var(--line); border-radius:6px; padding:8px 10px; min-height:2.2em; white-space:pre-wrap; }
  table { width:100%; border-collapse:collapse; font-variant-numeric: tabular-nums; }
  td { padding:3px 6px; border-bottom:1px solid var(--line); } td:last-child { text-align:right; }
  code { color:var(--muted); }
  #log { font:12px/1.4 ui-monospace, Consolas, monospace; max-height:160px; overflow:auto; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>cyber_gf · Step 12 v2</h1>
  <button id="btnConnect">連線數字人</button>
  <button id="btnDisconnect" class="secondary" disabled>中斷</button>
  <label class="muted" title="本機連線不需要；遠端/跨網段才勾選"><input type="checkbox" id="useStun"> STUN</label>
  <span class="muted">session: <code id="sid">—</code></span>
  <span class="muted">WebRTC: <code id="pcState">—</code></span>
</header>
<main>
  <section>
    <h2>數字人</h2>
    <video id="video" autoplay playsinline muted></video>
    <audio id="audio" autoplay></audio>
    <div class="row">
      <button id="btnRecord" class="secondary" disabled>開始錄影</button>
      <a id="recLink" class="muted" href="#" target="_blank" hidden>下載錄影</a>
    </div>
    <h2 style="margin-top:12px">WebRTC 接收統計 <span class="muted">(遠端畫面卡頓診斷)</span></h2>
    <table id="rtcStats"><tr><td class="muted">連線後顯示</td><td></td></tr></table>
  </section>

  <section>
    <h2>AI 對話測試</h2>
    <div class="row">
      <input type="file" id="wavFile" accept=".wav,audio/wav">
    </div>
    <div class="row">
      <label>LLM→TTS：
        <select id="mode"><option value="full">整段（預設，實測較快）</option><option value="sentence">逐句</option></select>
      </label>
      <button id="btnAsk" disabled>送出問題</button>
      <span>狀態：<span id="state" class="badge">idle</span></span>
    </div>
    <p class="muted" id="hint">先按「連線數字人」，影像出現後再選 WAV 送出。</p>
    <div class="muted">ASR 辨識</div><div class="text" id="transcript"></div>
    <div class="muted" style="margin-top:8px">LLM 回覆</div><div class="text" id="reply"></div>
    <h2 style="margin-top:12px">延遲（秒，從收到請求起算）</h2>
    <table id="metrics"></table>
    <h2 style="margin-top:12px">紀錄</h2>
    <div id="log"></div>
  </section>
</main>
<script>
const VOICE = `${location.protocol}//${location.hostname}:8020`;   // voice_service.py
let pc = null, sessionid = null, recording = false, statTimer = null, prevStats = {};
const $ = id => document.getElementById(id);
const log = m => { const d = $('log'); d.textContent = `${new Date().toLocaleTimeString()}  ${m}\n` + d.textContent; };

// ---- WebRTC: same negotiation as LiveTalking web/index.html (POST /offer -> sessionid)
async function connect() {
  const cfg = { sdpSemantics: 'unified-plan' };
  if ($('useStun').checked) cfg.iceServers = [{ urls: 'stun:stun.l.google.com:19302' }];
  pc = new RTCPeerConnection(cfg);
  pc.addEventListener('track', e => { (e.track.kind === 'video' ? $('video') : $('audio')).srcObject = e.streams[0]; });
  pc.addEventListener('connectionstatechange', () => {
    $('pcState').textContent = pc.connectionState;
    const up = pc.connectionState === 'connected';
    $('btnAsk').disabled = !up; $('btnRecord').disabled = !up;
    $('hint').textContent = up ? '已連線。選擇問題 WAV，按「送出問題」。' : '先按「連線數字人」。';
  });
  pc.addTransceiver('video', { direction: 'recvonly' });
  pc.addTransceiver('audio', { direction: 'recvonly' });
  $('btnConnect').disabled = true; $('btnConnect').textContent = '連線中…'; log('connecting…');
  await pc.setLocalDescription(await pc.createOffer());
  // wait for ICE gathering, but never more than 2 s (an unreachable STUN server can otherwise stall for tens of seconds)
  await new Promise(r => { if (pc.iceGatheringState === 'complete') return r();
    pc.addEventListener('icegatheringstatechange', () => pc.iceGatheringState === 'complete' && r());
    setTimeout(r, 2000); });
  const res = await fetch('/offer', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }) });
  const ans = await res.json();
  if (!ans.sdp) throw new Error(ans.msg || 'offer failed');
  sessionid = ans.sessionid; $('sid').textContent = sessionid;
  await pc.setRemoteDescription(ans);
  $('btnConnect').textContent = '已連線'; $('btnDisconnect').disabled = false;
  log(`connected, session ${sessionid}`);
  statTimer = setInterval(rtcStats, 1000);
  const es = new EventSource(`/sse?sessionid=${sessionid}`);          // LiveTalking playback events
  es.onmessage = e => { try { const m = JSON.parse(e.data); if (m.cyber_gf_utt) log(`LiveTalking playback ${m.status}`); } catch {} };
}
function disconnect() {
  if (pc) pc.close(); pc = null; sessionid = null; clearInterval(statTimer);
  $('sid').textContent = '—'; $('pcState').textContent = 'closed';
  $('btnConnect').disabled = false; $('btnConnect').textContent = '連線數字人';
  $('btnDisconnect').disabled = true; $('btnAsk').disabled = true; $('btnRecord').disabled = true;
}

// ---- WebRTC receive stats (for the remote-viewing stutter investigation)
async function rtcStats() {
  if (!pc) return;
  const rows = [];
  (await pc.getStats()).forEach(s => {
    if (s.type !== 'inbound-rtp') return;
    const p = prevStats[s.id] || {}; prevStats[s.id] = s;
    if (s.kind === 'video') {
      const jb = s.jitterBufferEmittedCount ? (1000 * s.jitterBufferDelay / s.jitterBufferEmittedCount).toFixed(0) : '—';
      rows.push(['video fps (decoded)', s.framesPerSecond ?? '—'], ['video frames dropped', s.framesDropped ?? 0],
                ['video freezes / total s', `${s.freezeCount ?? 0} / ${(s.totalFreezesDuration ?? 0).toFixed(2)}`],
                ['video jitter-buffer ms', jb], ['video packets lost', s.packetsLost ?? 0]);
    } else {
      rows.push(['audio concealed samples', s.concealedSamples ?? 0], ['audio jitter ms', ((s.jitter ?? 0) * 1000).toFixed(1)]);
    }
  });
  $('rtcStats').innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
}

// ---- recording (LiveTalking /record API) to verify saved-output sync
async function toggleRecord() {
  recording = !recording;
  await fetch('/record', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type: recording ? 'start_record' : 'end_record', sessionid }) });
  $('btnRecord').textContent = recording ? '停止錄影' : '開始錄影';
  if (!recording) { $('recLink').href = `/record/${sessionid}`; $('recLink').hidden = false; }
  log(recording ? 'recording…' : 'recording saved');
}

// ---- ask
const LABELS = { request_received: '收到請求', asr_done: 'ASR 完成', llm_first_token: 'LLM 第一個字',
  first_segment_ready: '第一段文字可合成', tts_first_chunk: 'TTS 第一塊音訊', first_audio_submitted: '第一筆音訊送出',
  first_frame_put_livetalking: 'LiveTalking 收到第一幀', avatar_speaking_start: '數字人開始說話',
  llm_done: 'LLM 完成', tts_done: 'TTS 完成', audio_stream_closed: '音訊串流結束', avatar_speaking_end: '數字人說完' };
async function ask() {
  const f = $('wavFile').files[0];
  if (!f) return alert('請先選擇 WAV 檔');
  $('btnAsk').disabled = true; $('transcript').textContent = ''; $('reply').textContent = ''; $('metrics').innerHTML = '';
  setState('queued');
  let r;
  try {
    r = await (await fetch(`${VOICE}/api/ask?sessionid=${sessionid}&mode=${$('mode').value}`, { method: 'POST', body: f })).json();
  } catch (e) { setState('error'); log(`voice service unreachable at ${VOICE}: ${e}`); $('btnAsk').disabled = false; return; }
  log(`job ${r.job}`);
  const poll = setInterval(async () => {
    const j = await (await fetch(`${VOICE}/api/job/${r.job}`)).json();
    setState(j.state); $('transcript').textContent = j.transcript; $('reply').textContent = j.reply;
    const rows = Object.entries(j.timestamps_s).sort((a, b) => a[1] - b[1])
      .map(([k, v]) => `<tr><td>${LABELS[k] || k}</td><td>${v.toFixed(3)}</td></tr>`);
    const m = j.metrics || {};
    if (j.state === 'done') rows.push(...[['音訊長度 s', m.audio_s_sent_16k], ['TTS chunks', m.tts_chunks], ['TTS 段數', m.tts_segments],
      ['LiveTalking 佇列最大 (幀)', m.lt_max_queue_frames], ['欠載 underruns / 幀', `${m.lt_underruns} / ${m.lt_underrun_frames}`],
      ['溢位 overflows', m.lt_overflows], ['LiveTalking fps (infer / final)', m.lt_fps ? `${m.lt_fps.infer ?? '—'} / ${m.lt_fps.final ?? '—'}` : '—']]
      .map(([k, v]) => `<tr><td>${k}</td><td>${v ?? '—'}</td></tr>`));
    $('metrics').innerHTML = rows.join('');
    if (j.state === 'done' || j.state === 'error') {
      clearInterval(poll); $('btnAsk').disabled = false;
      if (j.error) log(`error: ${j.error}`); else log(`done → ${m.output_dir || ''}`);
    }
  }, 200);
}
function setState(s) { const b = $('state'); b.textContent = s; b.className = `badge ${s}`; }

$('btnConnect').onclick = () => connect().catch(e => { log(`connect failed: ${e}`); $('hint').textContent = `連線失敗：${e}`; disconnect(); });
$('btnDisconnect').onclick = disconnect;
$('btnRecord').onclick = toggleRecord;
$('btnAsk').onclick = ask;
</script>
</body>
</html>
